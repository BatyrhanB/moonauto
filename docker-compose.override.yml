services:
  app:
    build:
      target: builder
    command: pnpm start:dev
    environment:
      NODE_ENV: development
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"